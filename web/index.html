<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open Data Discover: Toronto</title>
  <meta name="description" content="Select a column from a City of Toronto Open Data dataset to find other potentially joinable columns.">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body class="home">
  <header class="site-header wrap">
    <h1><a href="#">Open Data Discover: Toronto</a></h1>
    <p class="tagline">Select a column to find other potentially joinable columns.</p>
    <form class="picker" id="picker">
      <label>
        <span class="visually-hidden">Dataset</span>
        <input id="dataset" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false"
               aria-controls="datasets" placeholder="Loading datasets…" autocomplete="off" spellcheck="false" disabled>
        <ul id="datasets" class="dropdown" role="listbox" hidden></ul>
      </label>
      <label>
        <span class="visually-hidden">Column</span>
        <select id="column" disabled><option value="">Choose a column</option></select>
      </label>
    </form>
  </header>
  <main id="main" class="wrap" aria-live="polite"></main>
  <dialog id="report" class="report-dialog" aria-labelledby="report-title">
    <form>
      <h2 id="report-title">Report this join</h2>
      <p class="dim">With <span class="which"></span></p>
      <fieldset>
        <legend>What’s wrong with it?</legend>
        <label><input type="radio" name="reason" value="unrelated" required> The columns are unrelated</label>
        <label><input type="radio" name="reason" value="coincidental"> The values overlap by coincidence (IDs, years, small numbers)</label>
        <label><input type="radio" name="reason" value="wrong-entity"> They describe different kinds of data</label>
        <label><input type="radio" name="reason" value="other"> Something else</label>
      </fieldset>
      <label class="note">Note <span class="dim">(optional)</span>
        <textarea name="note" rows="3" maxlength="1000"></textarea></label>
      <p class="status" role="status"></p>
      <div class="actions">
        <button type="button" class="cancel">Cancel</button>
        <button type="submit">Send report</button>
      </div>
    </form>
  </dialog>
  <footer class="wrap dim">
    <p>Made at Civic Tech Toronto · Data sourced from
      <a href="https://open.toronto.ca/" target="_blank" rel="noopener">Open Data Toronto</a></p>
  </footer>
</body>
</html>
